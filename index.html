  .app{width:100%;max-width:900px;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Заголовок на всю ширину ---------- */
  .title{
    font-size:clamp(26px,3.4vw,38px);
    font-weight:800;
    line-height:1.12;
    letter-spacing:-.025em;
    color:var(--blue-dark);
    margin-bottom:6px;
    width:100%;
  }
  .subtitle{
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:16px;
  }

  .meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .bar{
    flex:1;
    height:6px;
    background:rgba(15,36,64,.12);
    border-radius:99px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
  }
  .bar > i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--blue),#3f9bff);
    border-radius:99px;
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  #counter{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.03em;
    white-space:nowrap;
  }

  .card{
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid rgba(255,255,255,.9);
    border-radius:24px;
    padding:40px 40px 34px;
    box-shadow:
      0 1px 2px rgba(11,42,85,.06),
      0 12px 28px rgba(11,42,85,.10),
      0 32px 70px rgba(11,42,85,.12);
  }

  .quote{
    font-size:23px;
    line-height:1.55;
    font-weight:450;
    color:var(--ink);
    margin-bottom:30px;
    padding-left:20px;
    border-left:3px solid rgba(26,99,216,.35);
    letter-spacing:-.005em;
  }

  .btns{display:grid;gap:12px}
  .btn{
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:20px 20px;
    min-height:66px;
    text-align:left;
    cursor:pointer;
    transition:.16s ease;
    display:flex;
    align-items:center;
    gap:13px;
    box-shadow:0 1px 2px rgba(11,42,85,.04);
    touch-action:manipulation;
  }
  .btn:hover:not(:disabled){border-color:#a9c4e6;box-shadow:0 4px 14px rgba(11,42,85,.09);transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:scale(.99)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .btn:disabled{cursor:default}
  .btn .num{
    width:28px;height:28px;flex:0 0 28px;border-radius:9px;
    background:#eef4fc;color:#7c95b5;
    font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .btn.correct{
    background:var(--ok-bg);border-color:rgba(18,133,90,.55);color:#0b6b49;
    box-shadow:0 4px 16px rgba(18,133,90,.14);
  }
  .btn.correct .num{background:var(--ok);color:#fff}
  .btn.wrong{
    background:var(--bad-bg);border-color:rgba(201,42,58,.5);color:#a81f2d;
  }
  .btn.wrong .num{background:var(--bad);color:#fff}
  .btn.dim{opacity:.42;box-shadow:none}

  /* ---------- Разбор ---------- */
  .feedback{
    margin-top:22px;
    border-radius:16px;
    padding:20px 20px 18px;
    display:none;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.show{display:block;animation:pop .28s ease}
  .feedback.good{background:var(--ok-bg);border:1px solid rgba(18,133,90,.28)}
  .feedback.bad{background:var(--bad-bg);border:1px solid rgba(201,42,58,.26)}

  .verdict{
    font-weight:700;font-size:16.5px;margin-bottom:14px;
    display:flex;gap:9px;align-items:flex-start;line-height:1.4;
  }
  .verdict .mark{
    flex:0 0 21px;width:21px;height:21px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;margin-top:1px;
  }
  .good .verdict{color:var(--ok)}
  .good .verdict .mark{background:var(--ok)}
  .bad .verdict{color:var(--bad)}
  .bad .verdict .mark{background:var(--bad)}

  .label{
    display:block;
    font-size:11px;font-weight:800;
    letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{
    font-size:14.5px;
    font-weight:600;
    line-height:1.35;
    color:#0b3f8f;
    background:rgba(26,99,216,.09);
    border:1px solid rgba(26,99,216,.22);
    border-radius:9px;
    padding:6px 11px;
  }

  .feedback p{font-size:15.5px;line-height:1.6;color:var(--ink-soft)}
  .feedback p + p{margin-top:10px}
  .feedback p b{color:var(--ink);font-weight:700}
  .feedback .typedef{
    border-top:1px dashed rgba(15,36,64,.15);
    padding-top:13px;
    margin-top:2px;
  }

  .next{
    margin-top:18px;
    width:100%;
    min-height:60px;
    padding:17px;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(100deg,#1550b8,#2b86f0);
    border:0;
    border-radius:14px;
    cursor:pointer;
    transition:.16s;
    box-shadow:0 6px 18px rgba(26,99,216,.28);
    touch-action:manipulation;
  }
  .next:hover{filter:brightness(1.07)}
  .next:active{transform:scale(.99)}

  /* ---------- Финальный экран ---------- */
  .final{text-align:center;padding:30px 12px 14px}
  .final .flabel{
    font-size:13px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);
  }
  .final .score{
    font-size:clamp(74px,10vw,104px);
    font-weight:800;
    line-height:1;
    margin:14px 0 6px;
    letter-spacing:-.035em;
    background:linear-gradient(100deg,#1550b8,#3f9bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .final .sub{
    color:var(--ink-soft);
    font-size:16px;font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .final .grade{
    display:inline-block;
    margin-top:22px;
    font-size:15px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    padding:9px 18px;border-radius:99px;
    background:rgba(26,99,216,.1);
    border:1px solid rgba(26,99,216,.25);
    color:#0b3f8f;
  }
  .final .msg{
    font-size:21px;
    line-height:1.5;
    font-weight:500;
    margin:26px auto 30px;
    max-width:620px;
    color:var(--ink);
  }
  .final .next{max-width:420px;margin-left:auto;margin-right:auto}
  .hidden{display:none !important}

  /* ---------- Крупные экраны: карточка по высоте ---------- */
  @media (min-width:900px) and (min-height:620px){
    .card{
      min-height:min(calc(100dvh - 150px), 700px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .card.final{justify-content:center}
  }

  /* ---------- Планшеты ---------- */
  @media (max-width:820px){
    body{padding:18px 14px}
    .card{padding:32px 28px 28px;border-radius:22px}
    .quote{font-size:21px}
  }

  /* ---------- Мобильные ---------- */
  @media (max-width:600px){
    body{
      padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
      align-items:flex-start;
      background-attachment:scroll;
      background-position:top center;
      background-size:auto 40vh;
      background-repeat:no-repeat;
      background-color:#eaf1fa;
    }
    .app{max-width:100%}
    .title{font-size:25px;line-height:1.15;margin-bottom:4px}
    .subtitle{font-size:11px;letter-spacing:.05em;margin-bottom:12px}
    .meta{gap:10px;margin-bottom:14px}
    #counter{font-size:12.5px}

    .card{padding:24px 18px 20px;border-radius:18px;background:rgba(255,255,255,.97)}
    .quote{font-size:18.5px;line-height:1.5;padding-left:14px;margin-bottom:22px}

    .btns{gap:9px}
    .btn{font-size:16px;min-height:64px;padding:16px 15px;gap:11px;border-radius:13px}
    .btn .num{width:26px;height:26px;flex-basis:26px;font-size:13px}

    .feedback{padding:16px 14px 14px;border-radius:14px;margin-top:16px}
    .verdict{font-size:15.5px}
    .chip{font-size:13.5px;padding:5px 9px}
    .feedback p{font-size:14.5px;line-height:1.55}

    .next{font-size:16px;min-height:58px;margin-top:16px}

    .final{padding:20px 6px 8px}
    .final .score{font-size:76px}
    .final .sub{font-size:14px}
    .final .grade{font-size:13.5px;margin-top:18px}
    .final .msg{font-size:18px;margin:22px auto 26px}
  }

  @media (max-width:380px){
    .title{font-size:22px}
    .quote{font-size:17px}
    .btn{font-size:15px}
    .final .score{font-size:66px}
    .final .msg{font-size:17px}
  }

  /* ---------- Ландшафт на телефоне ---------- */
  @media (max-height:520px) and (orientation:landscape){
    body{align-items:flex-start;padding-top:10px}
    .title{font-size:22px}
    .subtitle{display:none}
    .card{padding:18px}
    .quote{font-size:16px;margin-bottom:14px}
    .btn{min-height:48px;padding:11px 14px;font-size:14.5px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="app">

  <h1 class="title">Мотивация клиента</h1>
  <div class="subtitle">Тренажёр: определи тип мотивации</div>

  <div class="meta">
    <div class="bar"><i id="progress"></i></div>
    <div id="counter">1 / 6</div>
  </div>

  <div class="card" id="card">
    <div class="quote" id="phrase"></div>

    <div class="btns" id="btns">
      <button class="btn" data-type="explicit"><span class="num">1</span>Явная мотивация</button>
      <button class="btn" data-type="hidden"><span class="num">2</span>Скрытая мотивация</button>
      <button class="btn" data-type="deep"><span class="num">3</span>Глубинная мотивация</button>
    </div>

    <div class="feedback" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div id="feedbackText"></div>
    </div>

    <button class="next hidden" id="next">Следующая фраза →</button>
  </div>

  <div class="card final hidden" id="final">
    <div class="flabel">Ваш результат</div>
    <div class="score" id="finalScore">0 / 6</div>
    <div class="sub">правильных ответов</div>
    <div class="grade" id="finalGrade"></div>
    <div class="msg" id="finalMsg"></div>
    <button class="next" id="restart">Пройти заново</button>
  </div>

</div>

<script>
const TYPES = {
  explicit: {
    label: "Явная мотивация",
    desc: "Клиент прямо называет то, что ему нужно: продукт, опции, формальность. Это озвученный запрос — «хочу полис», «нужна такая-то опция». За ним пока нет ни личной боли, ни эмоции."
  },
  hidden: {
    label: "Скрытая мотивация",
    desc: "Клиент говорит о конкретных практических вещах, но настоящий мотив — не в них. Это реальные обстоятельства: парковка, дорогой ремонт, соседи, нервы, время. Мотив звучит «между строк», его надо услышать."
  },
  deep: {
    label: "Глубинная мотивация",
    desc: "В фразе звучит базовая потребность: безопасность семьи, страх стать обузой, контроль над жизнью, достоинство, статус. Это не про деньги и не про продукт — это про то, кем клиент себя чувствует."
  }
};

const QUESTIONS = [
  {
    phrase: "«Мы только что закончили дорогой ремонт, а дом старый, трубы ни к чёрту. Если вдруг прорвёт, я вообще не хочу связываться с соседями снизу и платить им из своего кармана».",
    answer: "hidden",
    markers: ["только что закончили дорогой ремонт", "трубы ни к чёрту", "не хочу связываться с соседями", "платить из своего кармана"],
    why: "Клиент называет обстоятельства, но покупает не «защиту имущества». Настоящий мотив — не платить из своего кармана и не влезать в конфликт с соседями."
  },
  {
    phrase: "«Мой дом — это моё единственное крупное вложение и моя крепость. Мне физически необходимо спать спокойно и знать, что бы ни случилось, моя семья не останется на улице ни с чем».",
    answer: "deep",
    markers: ["моя крепость", "спать спокойно", "семья не останется на улице", "единственное крупное вложение"],
    why: "Это уже не про деньги и не про ремонт, а про базовую потребность в безопасности и защите близких. Такой мотив не пересчитывают в рублях."
  },
  {
    phrase: "«Я паркуюсь во дворе, а там постоянно кто-то кого-то притирает. Мне мои нервы дороже: хочу, чтобы в случае чего я просто отдал ключи дилеру и не бегал по гаражам в поисках запчастей».",
    answer: "hidden",
    markers: ["паркуюсь во дворе", "постоянно притирает", "нервы дороже", "не бегал по гаражам"],
    why: "Формально речь о царапинах, но клиент сам проговаривает истинный мотив: комфорт и экономия времени, а не защита «железа»."
  },
  {
    phrase: "«Мне нужна страховка на новый автомобиль. Обязательно включите полное покрытие: от угона, тотала и любого ущерба, включая царапины».",
    answer: "explicit",
    markers: ["мне нужна страховка", "обязательно включите", "полное покрытие", "от угона, тотала"],
    why: "Чистый запрос на продукт: перечислены риски и опции, без личной истории и без эмоции."
  },
  {
    phrase: "«Мне нужен полис от травм для сына. Он начинает ходить в секцию по единоборствам, тренер сказал, что без страховки до соревнований не допустят».",
    answer: "explicit",
    markers: ["мне нужен полис", "тренер сказал", "без страховки не допустят"],
    why: "Мотив вынужденный и озвучен прямо: есть требование третьей стороны. Клиенту нужен документ."
  },
  {
    phrase: "«Я панически боюсь стать обузой для своих близких. Мне жизненно важно чувствовать себя сильным — тем, кто защищает семью, а не тем, из-за кого они вынуждены продавать имущество ради лечения».",
    answer: "deep",
    markers: ["боюсь стать обузой", "чувствовать себя сильным", "кто защищает семью", "продавать имущество ради лечения"],
    why: "Страх потери достоинства и роли в семье. Деньги тут лишь инструмент, мотив закрывается через уважение к его роли."
  }
];

let order = [], idx = 0, score = 0, answered = false;

const $ = id => document.getElementById(id);
const btns = [...document.querySelectorAll('.btn')];

function shuffle(a){
  const arr = [...a];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function start(){
  order = shuffle(QUESTIONS);
  idx = 0; score = 0;
  $('final').classList.add('hidden');
  $('card').classList.remove('hidden');
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function render(){
  answered = false;
  const q = order[idx];

  $('phrase').textContent = q.phrase;
  $('counter').textContent = (idx+1) + ' / ' + order.length;
  $('progress').style.width = ((idx/order.length)*100) + '%';

  btns.forEach(b => { b.disabled = false; b.className = 'btn'; });

  $('feedback').className = 'feedback';
  $('next').classList.add('hidden');
  $('next').textContent = idx === order.length-1 ? 'Показать результат →' : 'Следующая фраза →';
}

function choose(type){
  if(answered) return;
  answered = true;
  const q = order[idx];
  const correct = type === q.answer;
  if(correct) score++;

  btns.forEach(b => {
    b.disabled = true;
    const t = b.dataset.type;
    if(t === q.answer) b.classList.add('correct');
    else if(t === type) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'good' : 'bad');

  $('verdict').innerHTML =
    '<span class="mark">' + (correct ? '✓' : '✕') + '</span>' +
    '<span>' + (correct
      ? 'Верно — ' + TYPES[q.answer].label
      : 'Неверно. На самом деле это ' + TYPES[q.answer].label.toLowerCase()) + '</span>';

  const chips = q.markers.map(m => '<span class="chip">«' + m + '»</span>').join('');

  let html = '<div class="label">Слова-маркеры</div><div class="chips">' + chips + '</div>';

  if(!correct){
    html += '<p><b>Почему так.</b> ' + q.why + '</p>';
  }
  html += '<p class="typedef"><b>' + TYPES[q.answer].label + '.</b> ' + TYPES[q.answer].desc + '</p>';

  $('feedbackText').innerHTML = html;
  $('next').classList.remove('hidden');

  if(window.innerWidth < 600){
    setTimeout(() => $('next').scrollIntoView({behavior:'smooth', block:'center'}), 120);
  }
}

function next(){
  if(idx < order.length-1){
    idx++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    finish();
  }
}

function finish(){
  $('progress').style.width = '100%';
  $('card').classList.add('hidden');
  $('final').classList.remove('hidden');
  $('counter').textContent = order.length + ' / ' + order.length;

  $('finalScore').textContent = score + ' / ' + order.length;

  const pct = score / order.length;
  let grade, msg;
  if(pct === 1){
    grade = 'Отлично'; msg = 'Идеальный результат. Вы слышите не только слова клиента, но и то, что за ними стоит.';
  } else if(pct >= 0.83){
    grade = 'Очень хорошо'; msg = 'Почти идеально. Остался один нюанс — и вы читаете клиента безошибочно.';
  } else if(pct >= 0.66){
    grade = 'Хорошо'; msg = 'Крепкий результат. Тоньше всего разница между скрытым и глубинным мотивом — вот её и стоит отшлифовать.';
  } else if(pct >= 0.33){
    grade = 'Есть над чем работать'; msg = 'База есть, но уровни пока путаются. Скрытая мотивация — это про обстоятельства, глубинная — про потребность.';
  } else {
    grade = 'Нужно ещё потренироваться'; msg = 'Не страшно. Правило простое: явное клиент говорит сам, скрытое проговаривает через обстоятельства, глубинное звучит как «кем я себя чувствую».';
  }

  $('finalGrade').textContent = grade;
  $('finalMsg').textContent = msg;
  window.scrollTo({top:0,behavior:'smooth'});
}

btns.forEach(b => b.addEventListener('click', () => choose(b.dataset.type)));
$('next').addEventListener('click', next);
$('restart').addEventListener('click', start);

document.addEventListener('keydown', e => {
  if(['1','2','3'].includes(e.key) && !answered) choose(['explicit','hidden','deep'][+e.key-1]);
  if(e.key === 'Enter' && answered) next();
});

start();
</script>
</body>
</html>
